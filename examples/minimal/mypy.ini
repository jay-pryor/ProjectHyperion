# The type check is a gate, not an editor convenience: units live in the type
# (CORE-CON-001) and only a checker makes that true. check_units.py runs mypy over
# `files` and then proves the run discriminates units.
[mypy]
explicit_package_bases = True
namespace_packages = True
files = baseline, modules, validation
disallow_untyped_defs = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True

# Test functions need no `-> None`; their bodies are still checked, so a unit
# confusion inside a test is still an error.
[mypy-modules.*.conformance.*]
disallow_untyped_defs = False

[mypy-modules.*.tests.*]
disallow_untyped_defs = False

[mypy-validation.*]
disallow_untyped_defs = False
