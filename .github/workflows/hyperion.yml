name: hyperion

on:
  push:
  pull_request:

jobs:
  framework-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The registry is generated, never hand-maintained. A stale index is worse
      # than none, because it is trusted. Also validates frontmatter, duplicate
      # IDs, dangling cross-references, and human-only docs in the model loadout.
      - name: Registry current and references resolve
        run: python tooling/build_registry.py --check

      # CLAUDE.md imperatives derive from core documents and can go stale silently.
      # This does not prove an imperative is still correct; it forces someone to look.
      - name: Imperatives confirmed against their sources
        run: python tooling/check_imperatives.py

      # The trace checker is tested against examples/minimal and against broken copies
      # of it, one per rule it enforces. The fixture runs the example's suite itself,
      # so this step does not depend on the example-project job.
      - run: pip install pytest pyyaml
      - name: Trace checker rules hold
        run: pytest -q tooling/tests

  example-project:
    # examples/minimal is a project built under the framework. Running it here is
    # what makes the tooling testable: the trace checker runs against a real trace
    # directory, and the conformance suite is shown to fail against a null double.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/minimal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pytest pyyaml

      # pytest.ini writes trace/results.xml on every run; the checker reads outcomes
      # from it, so the suite runs immediately before the check (CORE-TRC-003).
      - name: Conformance, unit, and validation suites
        run: pytest -q

      # Strictness comes from the gate record in trace/reviews.yaml, not a flag.
      # --report must exit 0 on a clean chain and 1 on a broken one.
      - name: Traceability chain intact
        run: |
          python ../../tooling/check_traces.py
          python ../../tooling/check_traces.py --report > trace/matrix.md

      # Stub-as-mutant rule: a suite the null double passes checks shape, not
      # behaviour. The suite must fail against it. Its results go elsewhere so
      # trace/results.xml keeps the real run.
      - name: Conformance suite fails against the null double
        run: |
          if ATMOSPHERE_IMPL=null pytest -q modules/atmosphere/conformance --junitxml=/tmp/null-double.xml; then
            echo "conformance suite passed against the null double: it cannot fail"; exit 1
          fi
