name: hyperion

on:
  push:
  pull_request:

jobs:
  framework-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the commit checker walks the PR range

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # mypy is here for tooling/tests: test_check_units.py runs the real checker
      # against examples/minimal and skips itself without it, which would leave the
      # gate untested in the one job that tests the gates.
      - run: pip install pytest pyyaml "mypy>=1.11,<3"

      # The registry is generated, never hand-maintained. A stale index is worse
      # than none, because it is trusted. Also validates frontmatter (sessions,
      # agent fields, prevents and reader), duplicate IDs, dangling cross-references,
      # human-only docs in the model loadout, and the three prose rules that used to
      # be CLAUDE.md text: line limits, principle trace, no duplicate sentences (F-21).
      - name: Registry current and references resolve
        run: python tooling/build_registry.py --check

      # Everything a session consumes is rendered from fragments, frontmatter, and
      # the session-types block (CORE-IMP-001, M1). A stale rendering is a P3 violation
      # that the build can see, so it fails here.
      - name: Operating layer current
        run: python tooling/build_layer.py --check

      # Imperatives derive from sections of core and can go stale silently. Three
      # failure modes: source section changed, table differs from the map, one side
      # only. This does not prove an imperative is still correct; it forces a look.
      - name: Imperatives confirmed against their sources
        run: python tooling/check_imperatives.py

      # The trace checker and the commit checker are tested against examples/minimal,
      # broken copies of it, and a throwaway git repository, one test per rule.
      - name: Tooling rules hold
        run: pytest -q tooling/tests

      # Every framework commit carries its Session trailer (CORE-SES-001). On pushes as
      # well as pull requests: this repository is committed to directly, so a PR-only
      # check left the ordinary path unchecked and the scope hook without its backstop.
      # The range starts at the first commit that carried a trailer; a new branch, a
      # force push, or a tag gives no usable base, so it falls back to that commit.
      - name: Commits carry their session trailer
        env:
          FIRST_CHECKED: 218e6f55616e780f2b3458a64f0a9f25e8a69afa
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git cat-file -e "${BASE}^{commit}" 2>/dev/null || BASE="$FIRST_CHECKED"
          git merge-base --is-ancestor "$FIRST_CHECKED" "$BASE" || BASE="$FIRST_CHECKED"
          if [ "$BASE" = "$HEAD_SHA" ]; then echo "OK no new commits to check"; exit 0; fi
          python tooling/check_commit.py --framework "$BASE..$HEAD_SHA"

  example-project:
    # examples/minimal is a project built under the framework. Running it here is
    # what makes the tooling testable: the trace checker runs against a real trace
    # directory, and the conformance suite is shown to fail against a null double.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/minimal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # mypy is a gate here, not an editor convenience (CORE-CON-001). The range is
      # loose because check_units.py reads only mypy's reported errors and file count,
      # not its internals; a major bump is still a deliberate change.
      - run: pip install pytest pyyaml "mypy>=1.11,<3"

      # pytest.ini writes trace/results.xml on every run; the checker reads outcomes
      # from it, so the suite runs immediately before the check (CORE-TRC-003).
      - name: Conformance, unit, and validation suites
        run: pytest -q

      # Strictness comes from the gate record in trace/reviews.yaml, not a flag.
      # --report must exit 0 on a clean chain and 1 on a broken one; the matrix goes
      # to the log, and the console below is the artifact a reviewer receives.
      - name: Traceability chain intact
        run: |
          python ../../tooling/check_traces.py
          python ../../tooling/check_traces.py --report

      # The console (M8) is a pure function of the repository: one HTML file carrying
      # the commit hash and the checker's verdict, built after the check so its header
      # is honest. Uploaded, never committed.
      - name: Project console
        run: python ../../tooling/build_console.py . --out console/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: console
          path: examples/minimal/console/index.html

      # CORE-CON-003: the module map is drawn from modules/*/manifest.yaml and this is
      # what makes the drawing true. Four rules, all fatal: an import outside the module's
      # surface, an import the manifest does not list, a manifest entry nothing imports,
      # and a cycle. Without it the manifest enforces nothing and the diagram drifts.
      - name: Import graph matches the manifests
        run: python ../../tooling/check_boundaries.py .

      # CORE-CON-001: NewType units are erased at runtime, so the unit in the type is a
      # promise only while a checker runs. The step runs mypy over the project and then
      # proves that run rejects a unit confusion built from baseline/units.py. A mypy
      # that matched no files, or that ignores errors, passes the first half and fails
      # the second.
      - name: Units enforced by the type check
        run: python ../../tooling/check_units.py .

      # CORE-TST-002 rung 1: every module ships a null double and its conformance
      # suite must fail against it in errors, invariants, and boundaries. The script
      # writes each run's JUnit to a temp file so trace/results.xml keeps the real run.
      - name: Conformance suites fail against their null doubles
        run: python ../../tooling/check_null_doubles.py .

      # CORE-TST-002 rung 2: measure again and compare against what SL-01 records.
      # --check fails on a score the suite no longer earns and on a survivor with no
      # findings row; whether a recorded survivor is still open is check_traces.py's
      # above. Survivors are triaged by a human through trace/findings.yaml, never by
      # CI, and nothing is written here. The major version is pinned because the tool
      # reads mutmut 3.x internals and refuses anything else (it would otherwise parse
      # a mutmut 4 run as zero mutants). Every mutant runs in a subprocess; the example
      # is tiny, but allow time.
      - run: pip install "mutmut>=3,<4"
      - name: Mutation score for SL-01 still earned
        timeout-minutes: 20
        run: python ../../tooling/mutation_score.py --slice SL-01 --check .

  release-tag:
    # One version, one place (F-22): a release tag must equal `v$(cat VERSION)` and
    # CHANGELOG.md must have a heading for it. Runs only when a tag is pushed, so the
    # version cannot move without the changelog and the tag moving with it.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the range since the previous tag, for the check below

      - name: Tag equals VERSION and CHANGELOG.md has its heading
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "ERROR tag $TAG does not equal v$VERSION (VERSION file)"; exit 1
          fi
          if ! grep -Eq "^## $VERSION( |$)" CHANGELOG.md; then
            echo "ERROR CHANGELOG.md has no '## $VERSION' heading"; exit 1
          fi
          echo "OK tag $TAG matches VERSION and CHANGELOG.md"

      # Several FRAMEWORK sessions, one RELEASE (CORE-SES-001): the entry describes changes
      # that are already in, so over the range since the previous tag the commit that last
      # touched CHANGELOG.md must be the newest one. An entry written before the framework
      # commits it claims to summarise is the failure this catches.
      - name: The release commit is the newest in the range
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          if [ -z "$PREV" ]; then echo "OK $TAG is the first tag; no range to check"; exit 0; fi
          RANGE="$PREV..$TAG"
          CHANGED="$(git diff --name-only "$RANGE" -- . \
            ':!CHANGELOG.md' ':!VERSION' ':!README.md' ':!REGISTRY.md' ':!examples/*/.hyperion/version')"
          if [ -z "$CHANGED" ]; then echo "OK $RANGE changes no framework file"; exit 0; fi
          NEWEST="$(git rev-list -1 "$RANGE")"
          LAST="$(git rev-list -1 "$RANGE" -- CHANGELOG.md)"
          if [ "$LAST" != "$NEWEST" ]; then
            echo "ERROR $RANGE changes framework files, but CHANGELOG.md was last written in"
            echo "      ${LAST:-no commit in the range}, not in the newest commit $NEWEST."
            echo "      The entry predates what it describes; cut the release from a RELEASE session"
            echo "      after the FRAMEWORK sessions land (CORE-SES-001)."
            exit 1
          fi
          echo "OK the newest commit in $RANGE is the one that wrote CHANGELOG.md"
